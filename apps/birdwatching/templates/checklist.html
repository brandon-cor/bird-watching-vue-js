[[extend 'layout.html']]

<style>
[v-cloak] {
     display: none;
}
</style>


<div class="section" id="app" v-cloak>
  <!-- Put here your Vue.js template -->
  <h1 class="title">Checklist</h1>
  <!-- <p>Content: checklist_id: {{ checklist_id }} </p>
  <p>Content: from_url: {{ from_url }} </p> -->
  <div class="block">
    <div class="columns">
      <div class="column">
        <label class="label">Date</label>
        <input type="text" class="input" placeholder="date" v-model="date"/>
      </div>
      <div class="column">
        <label class="label">Start Time</label>
        <input type="text" class="input" placeholder="time" v-model="start_time"/>
      </div>
      <div class="column">
        <label class="label">Duration</label>
        <input type="text" class="input" placeholder="Duration" v-model="duration"/>
      </div>
      
    </div>
  </div>
</div>


[[block page_scripts]]
<!-- Loads the index-specific js for Vue -->
<script>
  let get_checklist_url = "[[=XML(get_checklist_url)]]";
</script>
<script src="js/checklist.js"></script>
[[end]]
