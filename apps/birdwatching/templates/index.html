[[extend 'layout.html']]

<style>
/* [v-cloak] {
    display: none;
} */

#map {
    height: 500px;
    width: 100%;
}
</style>

<div class="section" id="app" v-cloak>
    <h1 class="title"></i> Bird Watching App</h1>
    <p>Welcome to the Bird Watching App!</p>
    
    <!-- Map Container -->
    <div id="map"></div>
    
    <!-- Species Selection -->
    <div>
        <label for="species-select">Select Species:</label>
        <input id="species-select" v-model="selectedSpecies" placeholder="Type species name..." />
    </div>
    
    <!-- Action Buttons -->
    <div class="buttons">
        <a href="/birdwatching/checklist" class="button is-primary">Submit Checklist</a>
        <a href="/birdwatching/stats" class="button is-link">My Birding Stats</a>
        <button @click="fetchStatistics" class="button is-success">Statistics on Region</button>
    </div>
</div>

[[block page_scripts]]
<script>
    let my_callback_url = "[[=XML(my_callback_url)]]";
    let get_user_stats_url = "[[=XML(get_user_stats_url)]]";
    let get_species_trends_url = "[[=XML(get_species_trends_url)]]";
    let search_species_url = "[[=XML(search_species_url)]]";
    let heatmap_data_url = "[[=XML(heatmap_data_url)]]";
</script>
<script>
    // Initialize the map
    function initMap() {
        navigator.geolocation.getCurrentPosition((position) => {
            // Initialize Vue's `map` instance
            app.vue.map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: position.coords.latitude, lng: position.coords.longitude },
                zoom: 8,
            });

            // Initialize heatmap layer
            app.vue.heatmap = new google.maps.visualization.HeatmapLayer({
                data: [], // Initially empty
                map: app.vue.map,
                radius: 20,
                opacity: 0.6,
            });

            // Fetch heatmap data from the endpoint
            fetch(heatmap_data_url)
                .then((response) => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then((data) => {
                    const heatmapData = data.data.map((item) => {
                        return {
                            location: new google.maps.LatLng(item.latitude, item.longitude),
                            weight: item.density,
                        };
                    });
                    app.vue.heatmap.setData(heatmapData);
                })
                .catch((error) =>
                    console.error("Error fetching heatmap data:", error)
                );

            // Initialize drawing manager
            app.vue.drawingManager = new google.maps.drawing.DrawingManager({
                drawingMode: google.maps.drawing.OverlayType.RECTANGLE,
                drawingControl: true,
                drawingControlOptions: {
                    position: google.maps.ControlPosition.TOP_CENTER,
                    drawingModes: [google.maps.drawing.OverlayType.RECTANGLE],
                },
                rectangleOptions: {
                    fillColor: "#ffff00",
                    fillOpacity: 0.2, // Set transparency
                    strokeWeight: 5,
                    clickable: false,
                    editable: true,
                    zIndex: 1,
                },
            });

            // Add drawing manager to the map
            app.vue.drawingManager.setMap(app.vue.map);

            // Event listener for overlay complete
            google.maps.event.addListener(
                app.vue.drawingManager,
                "overlaycomplete",
                function (event) {
                    if (app.vue.selectedArea) {
                        app.vue.selectedArea.setMap(null); // Remove the existing rectangle
                    }
                    app.vue.selectedArea = event.overlay; // Store the new rectangle
                }
        );
    });
}

    window.initMap = initMap;
</script>

<!-- Load Google Maps API -->
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAA8lMIJa2_PXy94ZywUWiQjyh6kVT5Hlo&loading=async&libraries=visualization,drawing&callback=initMap"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/birdwatching/static/js/index.js"></script>
[[end]]
