[[extend 'layout.html']]

<style>
/* [v-cloak] {
    display: none;
} */

#map {
    height: 500px;
    width: 100%;
}
</style>

<div class="section" id="app" v-cloak>
    <h1 class="title"><i class="fa-solid fa-binoculars"></i> Bird Watching App</h1>
    <p>Welcome to the Bird Watching App!</p>
    
    <!-- Map Container -->
    <div id="map"></div>
    
    <!-- Species Selection -->
    <div>
        <label for="species-select">Select Species:</label>
        <input id="species-select" v-model="selectedSpecies" placeholder="Type species name..." />
    </div>
    
    <!-- Action Buttons -->
    <div class="buttons">
        <a href="birdwatching/checklist" class="button is-primary">Submit Checklist</a>
        <a href="/birdwatching/stats" class="button is-link">My Birding Stats</a>
        <button @click="fetchStatistics" class="button is-success">Statistics on Region</button>
    </div>
</div>

[[block page_scripts]]
<script>
    let my_callback_url = "[[=XML(my_callback_url)]]";
    let get_user_stats_url = "[[=XML(get_user_stats_url)]]";
    let get_species_trends_url = "[[=XML(get_species_trends_url)]]";
    let search_species_url = "[[=XML(search_species_url)]]";
    let heatmap_data_url = "[[=XML(heatmap_data_url)]]";
</script>
<script>
    // Initialize the map
    function initMap() {
        navigator.geolocation.getCurrentPosition(function (position) {
            // Initialize the map
            const map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: position.coords.latitude, lng: position.coords.longitude },
                zoom: 8,
            });

            // Heatmap data
            const heatMapData = [
                { location: new google.maps.LatLng(37.782, -122.447), weight: 0.5 },
                { location: new google.maps.LatLng(37.782, -122.443), weight: 2 },
                { location: new google.maps.LatLng(37.782, -122.441), weight: 3 },
                { location: new google.maps.LatLng(37.782, -122.439), weight: 2 },
                new google.maps.LatLng(37.782, -122.437),
                { location: new google.maps.LatLng(37.782, -122.435), weight: 0.5 },

                { location: new google.maps.LatLng(37.785, -122.447), weight: 3 },
                { location: new google.maps.LatLng(37.785, -122.445), weight: 2 },
                new google.maps.LatLng(37.785, -122.443),
                { location: new google.maps.LatLng(37.785, -122.441), weight: 0.5 },
                new google.maps.LatLng(37.785, -122.439),
                { location: new google.maps.LatLng(37.785, -122.437), weight: 2 },
                { location: new google.maps.LatLng(37.785, -122.435), weight: 3 },
            ];

            // Add heatmap layer
            const heatmap = new google.maps.visualization.HeatmapLayer({
                data: heatMapData,
            });
            heatmap.setMap(map);

            // Drawing Manager
            let rectangle; // Store the current rectangle
            const drawingManager = new google.maps.drawing.DrawingManager({
                drawingMode: google.maps.drawing.OverlayType.MARKER,
                drawingControl: true,
                drawingControlOptions: {
                    position: google.maps.ControlPosition.TOP_CENTER,
                    drawingModes: [google.maps.drawing.OverlayType.RECTANGLE],
                },
                rectangleOptions: {
                    fillColor: "#ffff00",
                    fillOpacity: 0.2, // Set transparency
                    strokeWeight: 5,
                    clickable: false,
                    editable: true,
                    zIndex: 1,
                },
            });

            // Event listener for overlay complete
            google.maps.event.addListener(drawingManager, "overlaycomplete", function (event) {
                if (rectangle) {
                    rectangle.setMap(null); // Remove the existing rectangle
                }
                rectangle = event.overlay; // Set the new rectangle
            });

            // Add drawing manager to map
            drawingManager.setMap(map);
        });
    }
    window.initMap = initMap;
</script>
</script>
<!-- Load Google Maps API -->
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAA8lMIJa2_PXy94ZywUWiQjyh6kVT5Hlo&loading=async&libraries=visualization,drawing&callback=initMap"></script>
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/index.js"></script>
[[end]]
